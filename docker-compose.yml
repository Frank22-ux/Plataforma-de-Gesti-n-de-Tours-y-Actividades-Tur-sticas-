version: '3.8'

services:
  # --------------------------------------------------------
  # Base de Datos: PostgreSQL + PostGIS
  # --------------------------------------------------------
  tourism_db:
    image: postgis/postgis:15-3.3-alpine
    container_name: tourism_postgres
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: tourism_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --------------------------------------------------------
  # Redis
  # --------------------------------------------------------
  tourism_redis:
    image: redis:alpine
    container_name: tourism_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --------------------------------------------------------
  # Backend NestJS
  # --------------------------------------------------------
  api:
    build: .
    container_name: tourism_backend
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - tourism_db
      - tourism_redis
    environment:
      DB_HOST: tourism_db
      DB_PORT: 5432
      DB_USERNAME: admin
      DB_PASSWORD: rootpassword
      DB_NAME: tourism_db
      REDIS_HOST: tourism_redis
      REDIS_PORT: 6379

  # --------------------------------------------------------
  # PgAdmin
  # --------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: tourism_pgadmin
    depends_on:
      - tourism_db
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: rootpassword

volumes:
  postgres_data:
  redis_data:
